tools:
  system-monitor:
    title: 系统监视器
    description: 查看本机 CPU、内存、磁盘、网络和进程活动。
    stageNotice: 工作区已就绪。下一阶段将接入实时系统采样。
    waitingForSampler: 正在等待系统采集器。
    metrics:
      cpu: CPU
      memory: 内存
      disk: 磁盘
      network: 网络
  api-client:
    title: API 客户端
    description: 在 Electron 桌面应用中发送受限 HTTP 请求并查看响应。
  git-workbench:
    title: Git 工作台
    description: 在 Electron 桌面应用中查看本地 Git 仓库。
  object-storage:
    title: 对象存储
    description: 查看 S3 兼容 Bucket 的对象和文本预览。
  container-workbench:
    title: 容器工作台
    description: 查看本机 Docker 容器。
