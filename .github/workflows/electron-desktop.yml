name: Electron desktop builds

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.platform }} desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package-script: electron:package:linux
          - os: macos-latest
            platform: macos
            package-script: electron:package:mac
          - os: windows-latest
            platform: windows
            package-script: electron:package:win

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Build platform packages
        run: pnpm ${{ matrix.package-script }}

      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils

      - name: Run Electron smoke tests on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:e2e:electron

      - name: Run Electron smoke tests
        if: matrix.platform != 'linux'
        run: pnpm test:e2e:electron

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 14
