name: Release new versions

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      artifact_run_id:
        description: Completed release run to reuse after a publishing-only failure
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git show-ref --verify "refs/tags/${RELEASE_TAG}"
          node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag does not match package version");'

      - id: release
        name: Resolve release metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${RELEASE_TAG#v}" >> $GITHUB_OUTPUT

  # Gate release publishing on the shared checks and reuse their app build for the archive.
  # Docker still performs its own multi-architecture image build after this gate.
  quality:
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

      - name: Package the validated app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: zip -r "it-tools-${RELEASE_VERSION}.zip" dist/*

      - name: Upload validated app
        uses: actions/upload-artifact@v4
        with:
          name: it-tools-${{ needs.prepare.outputs.release_version }}
          path: it-tools-${{ needs.prepare.outputs.release_version }}.zip
          if-no-files-found: error

  electron-release:
    if: ${{ !inputs.artifact_run_id }}
    name: ${{ matrix.platform }} desktop release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package-script: electron:package:linux
          - os: macos-latest
            platform: macos
            package-script: electron:package:mac
          - os: windows-latest
            platform: windows
            package-script: electron:package:win
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Build desktop packages
        run: pnpm ${{ matrix.package-script }}

      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils

      - name: Run Electron smoke tests on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:e2e:electron

      - name: Run Electron smoke tests
        if: matrix.platform != 'linux'
        run: pnpm test:e2e:electron

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  docker-release:
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    # A stalled multi-architecture push must fail visibly instead of blocking the release forever.
    timeout-minutes: 60
    needs:
      - prepare
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=it-tools-release
          cache-to: type=gha,mode=max,scope=it-tools-release
          tags: |
            bruceblink/it-tools:latest
            bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}
            ghcr.io/bruceblink/it-tools:latest
            ghcr.io/bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}

  github-release:
    if: ${{ always() && needs.prepare.result == 'success' && (inputs.artifact_run_id || (needs.quality.result == 'success' && needs.docker-release.result == 'success' && needs.electron-release.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - prepare
      - quality
      - docker-release
      - electron-release
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download validated app
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: it-tools-${{ needs.prepare.outputs.release_version }}

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: desktop-*
          path: desktop
          merge-multiple: false

      - name: Remove packaging logs from recovered artifacts
        run: find desktop -type f -name 'builder-debug.yml' -delete

      - name: Check out current publishing checks
        if: inputs.artifact_run_id
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/verify-release-run.mjs
          sparse-checkout-cone-mode: false

      - name: Verify recovered run
        if: inputs.artifact_run_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: node .release-tools/scripts/verify-release-run.mjs "$SOURCE_RUN_ID" prepare quality "macos desktop release" "windows desktop release" docker-release "linux desktop release"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js for update metadata validation
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - name: Install release metadata dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify desktop update metadata and checksums
        run: node scripts/verify-update-assets.mjs desktop

      - name: Include Web archive checksum
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: sha256sum "it-tools-${RELEASE_VERSION}.zip" >> desktop/SHA256SUMS.txt

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

      - name: Compose release body
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          {
            cat release-notes.md
            echo
            echo "## 🌐 Web 应用 / Web App"
            echo
            echo "- \`it-tools-${RELEASE_VERSION}.zip\`"
            echo
            echo "## 🖥️ 桌面版 / Desktop Apps"
            echo
            echo "- Windows x64: NSIS installer"
            echo "- Linux x64: AppImage and Debian package"
            echo "- macOS ARM64: DMG and ZIP"
            echo
            echo "## 📦 Docker 镜像 / Docker Images"
            echo
            echo "- \`bruceblink/it-tools:latest\`"
            echo "- \`bruceblink/it-tools:${RELEASE_VERSION}\`"
            echo "- \`ghcr.io/bruceblink/it-tools:latest\`"
            echo "- \`ghcr.io/bruceblink/it-tools:${RELEASE_VERSION}\`"
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            it-tools-${{ needs.prepare.outputs.release_version }}.zip
            desktop/**/*
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          draft: false
          prerelease: false
          body_path: release-body.md
          generate_release_notes: false
