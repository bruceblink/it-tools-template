name: Release new versions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - id: release
        name: Resolve release metadata
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  docker-release:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bruceblink/it-tools:latest
            bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}
            ghcr.io/bruceblink/it-tools:latest
            ghcr.io/bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}

  github-release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - docker-release
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm validate

      - name: Zip the app
        run: zip -r it-tools-${{ needs.prepare.outputs.release_version }}.zip dist/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

      - name: Compose release body
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          {
            cat release-notes.md
            echo
            echo "## 📦 Docker 镜像 / Docker Images"
            echo
            echo "- \`bruceblink/it-tools:latest\`"
            echo "- \`bruceblink/it-tools:${RELEASE_VERSION}\`"
            echo "- \`ghcr.io/bruceblink/it-tools:latest\`"
            echo "- \`ghcr.io/bruceblink/it-tools:${RELEASE_VERSION}\`"
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: it-tools-${{ needs.prepare.outputs.release_version }}.zip
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          draft: true
          prerelease: false
          body_path: release-body.md
          generate_release_notes: false
