name: Release new versions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - id: release
        name: Resolve release metadata
        run: |
          echo "release_tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # Gate release publishing on the shared checks and reuse their app build for the archive.
  # Docker still performs its own multi-architecture image build after this gate.
  quality:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate project
        run: pnpm check

      - name: Package the validated app
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: zip -r "it-tools-${RELEASE_VERSION}.zip" dist/*

      - name: Upload validated app
        uses: actions/upload-artifact@v4
        with:
          name: it-tools-${{ needs.prepare.outputs.release_version }}
          path: it-tools-${{ needs.prepare.outputs.release_version }}.zip
          if-no-files-found: error

  electron-release:
    name: ${{ matrix.platform }} desktop release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs:
      - prepare
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package-script: electron:package:linux
          - os: macos-latest
            platform: macos
            package-script: electron:package:mac
          - os: windows-latest
            platform: windows
            package-script: electron:package:win
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron runtime
        run: pnpm exec install-electron

      - name: Build desktop packages
        run: pnpm ${{ matrix.package-script }}

      - name: Install Linux display dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth x11-utils

      - name: Run Electron smoke tests on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum pnpm test:e2e:electron

      - name: Run Electron smoke tests
        if: matrix.platform != 'linux'
        run: pnpm test:e2e:electron

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: error
          retention-days: 7

  docker-release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bruceblink/it-tools:latest
            bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}
            ghcr.io/bruceblink/it-tools:latest
            ghcr.io/bruceblink/it-tools:${{ needs.prepare.outputs.release_version }}

  github-release:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - quality
      - docker-release
      - electron-release
    steps:
      - name: Checkout
        uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
        with:
          fetch-depth: 0

      - name: Download validated app
        uses: actions/download-artifact@v4
        with:
          name: it-tools-${{ needs.prepare.outputs.release_version }}

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
          merge-multiple: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --tag "$RELEASE_TAG" \
            --output release-notes.md

      - name: Compose release body
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          {
            cat release-notes.md
            echo
            echo "## 🌐 Web 应用 / Web App"
            echo
            echo "- \`it-tools-${RELEASE_VERSION}.zip\`"
            echo
            echo "## 🖥️ 桌面版 / Desktop Apps"
            echo
            echo "- Windows x64: NSIS installer"
            echo "- Linux x64: AppImage and Debian package"
            echo "- macOS ARM64: DMG and ZIP"
            echo
            echo "## 📦 Docker 镜像 / Docker Images"
            echo
            echo "- \`bruceblink/it-tools:latest\`"
            echo "- \`bruceblink/it-tools:${RELEASE_VERSION}\`"
            echo "- \`ghcr.io/bruceblink/it-tools:latest\`"
            echo "- \`ghcr.io/bruceblink/it-tools:${RELEASE_VERSION}\`"
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            it-tools-${{ needs.prepare.outputs.release_version }}.zip
            desktop/**/*
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          draft: false
          prerelease: false
          body_path: release-body.md
          generate_release_notes: false
