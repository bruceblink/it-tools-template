name: E2E tests
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
  push:
    branches:
      # This helps fill the caches properly, caches are not shared between PRs.
      - main
    # Don't run CI for changes that only touch docs or license files
    paths-ignore:
      - '**/*.md'
      - 'README*'
      - 'LICENSE'
      - 'LICENSE*'
      - '.gitignore'
      - 'docs/**'
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4

      - run: corepack enable

      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$PLAYWRIGHT_VERSION"
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: pnpm build

      # Exact keys keep browser binaries aligned with the installed Playwright version.
      - name: Restore Playwright browsers from cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}-${{ hashFiles('**/playwright.config.ts') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e --shard=${{ matrix.shard }}
